<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts load in one request that does not hold up the first paint (text shows in a plain font for a moment, then switches) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" /></noscript>
    <!-- Home page tags. The build writes a copy for every other page with its own tags (scripts/head-tags.js),
         and src/components/PageMeta.jsx updates them as visitors move between pages -->

    <title>Laya Space Design</title>
    <meta name="description" content="Aluminium interiors, windows, doors and partitions. 35+ years of experience." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Laya Space Design" />
    <meta property="og:title" content="Laya Space Design" />
    <meta property="og:description" content="Aluminium interiors, windows, doors and partitions. 35+ years of experience." />
    <meta property="og:image" content="https://www.layaspacedesign.com/images/social/home-logo.png" />
    <!-- Size of the Home preview image (square logo); removed from other pages' copies -->
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <meta property="og:url" content="https://www.layaspacedesign.com/" />
    <meta name="twitter:image" content="https://www.layaspacedesign.com/images/social/home-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Business details for Google (schema.org). Organization, not LocalBusiness, because no street address is published -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.layaspacedesign.com/#organization",
            "name": "Laya Space Design",
            "url": "https://www.layaspacedesign.com/",
            "logo": "https://www.layaspacedesign.com/images/laya-logo.png",
            "image": "https://www.layaspacedesign.com/images/hero/living1.jpg",
            "description": "Engineers & Contractors in Architectural Aluminium Building Products: aluminium interiors, windows, doors and partitions for homes and offices.",
            "email": "layaspacedesign1993@gmail.com",
            "telephone": "+91 83418 84094",
            "areaServed": [
              { "@type": "City", "name": "Hyderabad" },
              { "@type": "City", "name": "Warangal" },
              { "@type": "City", "name": "Karimnagar" },
              { "@type": "State", "name": "Andhra Pradesh" }
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer service",
              "telephone": "+91 83418 84094",
              "email": "layaspacedesign1993@gmail.com",
              "hoursAvailable": {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
                "opens": "09:00",
                "closes": "19:00"
              }
            },
            "sameAs": ["https://www.instagram.com/laya.aluminiums/"]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.layaspacedesign.com/#website",
            "name": "Laya Space Design",
            "url": "https://www.layaspacedesign.com/",
            "publisher": { "@id": "https://www.layaspacedesign.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
