<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Home page tags. The build writes a copy for every other page with its own tags (scripts/head-tags.js),
         and src/components/PageMeta.jsx updates them as visitors move between pages -->

    <title>Laya Space Design</title>
    <meta name="description" content="Aluminium interiors, windows, doors and partitions for homes and offices in Hyderabad, Warangal, Karimnagar and Andhra Pradesh, with 35+ years of experience." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Laya Space Design" />
    <meta property="og:title" content="Laya Space Design" />
    <meta property="og:description" content="Aluminium interiors, windows, doors and partitions for homes and offices in Hyderabad, Warangal, Karimnagar and Andhra Pradesh, with 35+ years of experience." />
    <meta property="og:image" content="https://www.layaspacedesign.com/images/social/home-banner.jpg" />
    <!-- Size of the Home banner card; tells WhatsApp it's a wide image (removed from other pages' copies) -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://www.layaspacedesign.com/" />
    <meta name="twitter:image" content="https://www.layaspacedesign.com/images/social/home-banner.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Business details for Google (schema.org). Organization, not LocalBusiness, because no street address is published -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.layaspacedesign.com/#organization",
            "name": "Laya Space Design",
            "url": "https://www.layaspacedesign.com/",
            "logo": "https://www.layaspacedesign.com/images/laya-logo.png",
            "description": "Engineers & Contractors in Architectural Aluminium Building Products: aluminium interiors, windows, doors and partitions for homes and offices.",
            "email": "layaspacedesign1993@gmail.com",
            "telephone": "+91 83418 84094",
            "areaServed": [
              { "@type": "City", "name": "Hyderabad" },
              { "@type": "City", "name": "Warangal" },
              { "@type": "City", "name": "Karimnagar" },
              { "@type": "State", "name": "Andhra Pradesh" }
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer service",
              "telephone": "+91 83418 84094",
              "email": "layaspacedesign1993@gmail.com",
              "hoursAvailable": {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
                "opens": "09:00",
                "closes": "19:00"
              }
            },
            "sameAs": ["https://www.instagram.com/laya.aluminiums/"]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.layaspacedesign.com/#website",
            "name": "Laya Space Design",
            "url": "https://www.layaspacedesign.com/",
            "publisher": { "@id": "https://www.layaspacedesign.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script> window.chtlConfig = { chatbotId: "8712258998" } </script>
    <script async data-id="8712258998" id="chtl-script" type="text/javascript" src="https://chatling.ai/js/embed.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
